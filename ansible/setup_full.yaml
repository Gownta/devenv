# Run setup_devenv.yaml first; this builds on the devenv checkout and dotfiles.

- name: Install packages
  hosts: all
  become: yes

  tasks:
  - name: Set timezone
    timezone:
      name: "America/Los_Angeles"

  - name: Install packages
    dnf:
      name:
        - ansible
        - atop
        - clang
        - clang-tools-extra
        # - grpcio
        # - grpcio-tools
        - htop
        - httpd
        - jq
        - nodejs
        - npm
      state: present

  # Don't install pips; they should be in venvs.
  # I'm looking at you jupyter, and awscli, and pyopensky...
  # ...except I don't like venvs
  - name: Install pips
    pip:
      name:
        - black
        - ipdb
        - openai
        - lupa # lua from python
        - Flask
        - meson
        - pytest
        - coverage
        - qrcode
        - Pillow
      state: present

  - name: systemd enable
    ansible.builtin.systemd_service:
      name: atop
      enabled: true

  - name: systemd start
    ansible.builtin.systemd_service:
      name: atop
      state: started


- name: Configure user
  hosts: all
  vars:
    username: "njormrod"
    devenv: "cloud_linux"
  become: yes
  become_user: "{{ username }}"

  tasks:
  - name: Create directories
    file:
      path: "~/{{ item }}"
      state: directory
      recurse: yes
    with_items:
      - jupyter
      - repos
      - .config/pyopensky

  - name: Clone github repos
    # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/git_module.html
    ansible.builtin.git:
      repo: "git@github.com:{{ item.maker }}/{{ item.name }}.git"
      dest: "~/{{ item.root }}/{{ item.name }}"
      force: false
      update: false
      accept_hostkey: yes
      key_file: "~/.ssh/id_ed25519"
    with_items:
      - { root: "dev", maker: "Gownta", name: "starlang" }
      - { root: "dev", maker: "Gownta", name: "factorio" }
      - { root: "dev", maker: "Gownta", name: "values" }
      - { root: "dev", maker: "Gownta", name: "hanabi" }
      - { root: "dev", maker: "Gownta", name: "farmwars" }
      - { root: "dev", maker: "Gownta", name: "opensky" }
      - { root: "dev", maker: "Gownta", name: "libai" }
      - { root: "dev", maker: "Gownta", name: "lexemes" }
      - { root: "dev", maker: "Gownta", name: "factorio" }
      - { root: "dev", maker: "Gownta", name: "quacks_of_quedlinburg" }
      - { root: "dev", maker: "Gownta", name: "ai_gullibility_test" }
      - { root: "dev", maker: "Gownta", name: "planet_miner" }
      - { root: "dev", maker: "Gownta", name: "cain" }
      - { root: "dev", maker: "Gownta", name: "idle_civ" }
      - { root: "dev", maker: "Gownta", name: "template" }
      - { root: "dev", maker: "Gownta", name: "flip7" }
      - { root: "dev", maker: "Gownta", name: "botc" }
      - { root: ".vim/bundle", maker: "VundleVim", name: "Vundle.vim" }
      - { root: "repos", maker: "sharkdp", name: "bat" }
      - { root: "repos", maker: "eza-community", name: "eza" }
      - { root: "repos", maker: "romkatv", name: "powerlevel10k" }
      - { root: "repos", maker: "wube", name: "factorio-data" }
      - { root: "repos", maker: "atanunq", name: "viu" }
      - { root: "repos", maker: "en-wl", name: "wordlist" }
      - { root: "repos", maker: "dwyl", name: "english-words" }
      - { root: "repos", maker: "david47k", name: "top-english-wordlists" }

  - name: Check if cargo is installed
    shell: command -v cargo
    register: cargo_exists
    ignore_errors: yes

  - name: Download rust installer
    when: cargo_exists is failed
    get_url:
      url: https://sh.rustup.rs
      dest: /tmp/sh.rustup.rs
      mode: '0755'
      force: 'yes'
    tags:
      - rust

  - name: Install rust/cargo
    when: cargo_exists is failed
    shell: /tmp/sh.rustup.rs --no-modify-path -y
    tags:
      - rust

  - name: Check if bat is installed
    shell: command -v bat
    register: bat_exists
    ignore_errors: yes

  - name: Install bat
    when: bat_exists is failed
    shell: cargo install --locked bat
    args:
      chdir: ~/repos/bat

  - name: Check if eza is installed
    shell: command -v eza
    register: eza_exists
    ignore_errors: yes

  - name: Install eza
    when: eza_exists is failed
    shell: cargo install --locked eza
    args:
      chdir: ~/repos/eza

  - name: Setup vim vundle
    command: "vim +PluginInstall +qall"
